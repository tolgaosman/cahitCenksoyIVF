<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://*.google.com https://translate.googleapis.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com https://www.gstatic.com; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https:; connect-src 'self' https://*.googleapis.com https://*.google.com https://cahit-cenksoy-admin.onrender.com; frame-src https://*.google.com; object-src 'none'; base-uri 'self'">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Blog & Güncel Bilgiler | Dr. Cahit Cenksoy IVF Clinic</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="browserLogo.png?v=1.1">
    <link rel="stylesheet" href="style.css?v=5.3">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Blog Custom Premium Styling */
        .blog-hero {
            background: linear-gradient(135deg, var(--bg-light) 0%, var(--bg-color) 100%);
            padding: 80px 0 50px 0;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
        }
        .blog-hero h1 {
            font-size: 3rem;
            color: var(--primary-color);
            margin-bottom: 15px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .blog-hero p {
            font-size: 1.15rem;
            color: var(--text-muted);
            max-width: 800px;
            margin: 0 auto;
            line-height: 1.6;
        }

        .blog-container {
            max-width: 1100px;
            margin: 50px auto 80px auto;
            padding: 0 20px;
        }

        /* Search Bar & Categories */
        .blog-search-wrapper {
            position: relative;
            margin-bottom: 35px;
            box-shadow: var(--shadow-md);
            border-radius: 50px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }
        .blog-search-input {
            width: 100%;
            padding: 18px 24px 18px 60px;
            font-size: 1.05rem;
            border: none;
            background-color: var(--card-bg);
            color: var(--text-main);
            transition: var(--transition);
        }
        .blog-search-input:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(248, 200, 220, 0.3);
        }
        [data-theme="dark"] .blog-search-input:focus {
            box-shadow: 0 0 0 3px rgba(210, 145, 188, 0.3);
        }
        .blog-search-icon {
            position: absolute;
            left: 24px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1.2rem;
            pointer-events: none;
        }

        .blog-categories {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 35px;
        }
        .blog-cat-btn {
            background-color: var(--card-bg);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .blog-cat-btn:hover, .blog-cat-btn.active {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
        }

        .blog-results-counter {
            text-align: center;
            margin-bottom: 30px;
            font-size: 0.95rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .blog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 40px;
        }

        .blog-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: var(--shadow-md);
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            cursor: pointer;
        }

        .blog-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-lg);
            border-color: var(--primary-color);
        }

        .blog-img-placeholder {
            height: 220px;
            background: linear-gradient(135deg, var(--primary-color) 0%, #ffdfeb 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 4rem;
            color: white;
            position: relative;
            overflow: hidden;
        }
        [data-theme="dark"] .blog-img-placeholder {
            background: linear-gradient(135deg, var(--primary-color) 0%, #3a1c2e 100%);
        }
        .blog-img-placeholder::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255,255,255,0.15) 10%, transparent 10.01%);
            background-size: 20px 20px;
            opacity: 0.4;
        }

        .blog-body {
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            flex-grow: 1;
        }

        .blog-tag {
            align-self: flex-start;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 5px 12px;
            border-radius: 20px;
            background-color: var(--bg-light);
            color: var(--primary-color);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border: 1px solid var(--border-color);
        }

        .blog-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1.4;
            transition: var(--transition);
            margin: 0;
        }
        .blog-card:hover .blog-title {
            color: var(--primary-color);
        }

        .blog-excerpt {
            font-size: 0.95rem;
            color: var(--text-muted);
            line-height: 1.6;
            margin: 0;
        }

        .blog-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
            margin-top: auto;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .blog-author {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .blog-author-avatar {
            width: 25px;
            height: 25px;
            border-radius: 50%;
            background-color: var(--primary-color);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.75rem;
        }

        .blog-readmore {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--primary-color);
            font-weight: 600;
            font-size: 0.95rem;
            transition: var(--transition);
            margin-top: 5px;
        }
        .blog-card:hover .blog-readmore {
            gap: 10px;
        }

        /* No Results Section */
        .blog-no-results {
            text-align: center;
            padding: 60px 40px;
            display: none;
        }
        .blog-no-results i {
            font-size: 3.5rem;
            color: var(--text-muted);
            margin-bottom: 20px;
        }
        .blog-no-results h3 {
            font-size: 1.4rem;
            color: var(--text-main);
            margin-bottom: 8px;
        }
        .blog-no-results p {
            color: var(--text-muted);
        }

        /* RTL Alignment */
        .rtl .blog-body {
            text-align: right;
        }
        .rtl .blog-tag {
            align-self: flex-end;
        }
        .rtl .blog-meta {
            flex-direction: row-reverse;
        }
        .rtl .blog-author {
            flex-direction: row-reverse;
        }
        .rtl .blog-search-input {
            padding: 18px 60px 18px 24px;
        }
        .rtl .blog-search-icon {
            left: auto;
            right: 24px;
        }


    </style>
</head>
<body>
    <div id="site-header"></div>
    <!-- Spacer for fixed navbar -->
    <div style="height: 90px;"></div>

    <!-- Blog Hero Section -->
    <header class="blog-hero">
        <div class="container">
            <h1 data-i18n="blogTitle" id="blogHeroTitle" style="cursor: default;">Blog & Güncel Bilgiler</h1>
            <p data-i18n="blogSubtitle">Tüp bebek süreçleri, Kıbrıs'taki modern tedavi uygulamaları ve sağlıklı yaşam önerilerine dair en güncel makalelerimiz.</p>
        </div>
    </header>

    <main class="blog-container">
        <!-- Search Field -->
        <div class="blog-search-wrapper">
            <i class="fa-solid fa-magnifying-glass blog-search-icon"></i>
            <input type="text" id="blogSearch" class="blog-search-input" placeholder="Makale veya konu içinde arayın..." data-i18n="blogSearchPlaceholder">
        </div>

        <!-- Category Filters -->
        <div class="blog-categories">
            <button class="blog-cat-btn active" data-filter="all">
                <i class="fa-solid fa-list"></i> <span data-i18n="blogCatAll">HEPSİ</span>
            </button>
            <button class="blog-cat-btn" data-filter="ivf-treatment">
                <i class="fa-solid fa-baby"></i> <span data-i18n="blogCatIVF">TÜP BEBEK & TEDAVİ</span>
            </button>
            <button class="blog-cat-btn" data-filter="cyprus-donation">
                <i class="fa-solid fa-palm-tree"></i> <span data-i18n="blogCatDonation">KIBRIS'TA BAĞIŞ</span>
            </button>
            <button class="blog-cat-btn" data-filter="health-lifestyle">
                <i class="fa-solid fa-heart"></i> <span data-i18n="blogCatLifestyle">SAĞLIK & YAŞAM</span>
            </button>
        </div>
        <!-- Dynamic Counter -->
        <div class="blog-results-counter" id="blogCounter">Toplam 0 makale listeleniyor</div>

        <!-- Blog Grid -->
        <div class="blog-grid" id="blogGrid">
            
        </div>

        <!-- No Results Found Div -->
        <div class="blog-no-results" id="blogNoResults">
            <i class="fa-solid fa-magnifying-glass-minus"></i>
            <h3 data-i18n="blogNoResultsTitle">Makale Bulunamadı</h3>
            <p data-i18n="blogNoResultsText">Arama teriminize veya seçili kategoriye uygun yazı bulunamadı. Lütfen başka bir anahtar kelime deneyin.</p>
        </div>

    </main>

    <!-- Footer -->
    <div id="site-footer"></div>
    <a href="https://wa.me/905488880112" class="whatsapp-float" target="_blank" rel="noopener noreferrer">
        <i class="fa-brands fa-whatsapp"></i>
    </a>
    

    
    <script src="components.js"></script>
    <script src="translations.js"></script>
    <script src="app.js?v=5.3"></script>
    <script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <!-- Blog Management & Filtering Script (Connected to Firebase) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCRGvbp9E30tE_0-FTr4Oq1DnoteEdwtfI",
            authDomain: "in-vitro-fertilization-154m9k.firebaseapp.com",
            projectId: "in-vitro-fertilization-154m9k",
            storageBucket: "in-vitro-fertilization-154m9k.appspot.com",
            messagingSenderId: "73069645780",
            appId: "1:73069645780:web:6d6f7a21a1d1ac26bd1041"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.addEventListener('DOMContentLoaded', () => {
            const searchInput  = document.getElementById('blogSearch');
            const catBtns      = document.querySelectorAll('.blog-cat-btn');
            const counterDiv   = document.getElementById('blogCounter');
            const noResultsDiv = document.getElementById('blogNoResults');
            const grid         = document.getElementById('blogGrid');

            let cardCounter = 0; // for coloring
            function buildCard(post) {
                const gradients = [
                    'linear-gradient(135deg, var(--primary-color) 0%, #ffdfeb 100%)',
                    'linear-gradient(135deg, var(--primary-color) 0%, #ffeedd 100%)',
                    'linear-gradient(135deg, var(--primary-color) 0%, #d4fcd4 100%)'
                ];
                const icons = ['fa-heart-pulse', 'fa-circle-nodes', 'fa-spa'];
                const idx = cardCounter % 3;
                cardCounter++;

                const text = (post.title + " " + (post.summary || "")).toLowerCase();
                let category = "ivf-treatment";
                let tag      = "IVF & Tedavi";
                
                if (text.includes("bağış") || text.includes("donasyon") || text.includes("sperm") || text.includes("yumurta") || text.includes("kıbrıs") || text.includes("donation")) {
                    category = "cyprus-donation";
                    tag      = "Kıbrıs Donasyon";
                } else if (text.includes("sağlık") || text.includes("yaşam") || text.includes("beslenme") || text.includes("spor") || text.includes("diyet") || text.includes("lifestyle") || text.includes("yaş")) {
                    category = "health-lifestyle";
                    tag      = "Sağlık & Yaşam";
                }

                // GÜVENLİK: dinamik alanları (title, summary, author, imageUrl) güvenli DOM ile
                // bas; iskeleti sabit innerHTML'den kur, değerleri textContent/setAttribute ile yerleştir.
                const article = document.createElement('article');
                article.className = 'blog-card';
                article.setAttribute('data-category', category);
                article.setAttribute('data-id', post.id);
                article.innerHTML = `
                        <div class="blog-body">
                            <span class="blog-tag"></span>
                            <h3 class="blog-title"></h3>
                            <p class="blog-excerpt"></p>
                            <div class="blog-meta">
                                <div class="blog-author">
                                    <div class="blog-author-avatar" style="overflow:hidden; display:flex; align-items:center; justify-content:center;"><img src="cahit.jpg" alt="Dr. Cahit Cenksoy" style="width:100%;height:100%;object-fit:cover;border-radius:50%;"></div>
                                    <span class="blog-author-name"></span>
                                </div>
                                <div><i class="fa-solid fa-calendar"></i> <span class="blog-date"></span></div>
                            </div>
                        </div>`;

                let cover;
                if (post.imageUrl) {
                    cover = document.createElement('img');
                    cover.src = post.imageUrl;
                    cover.alt = post.title || '';
                    cover.style.cssText = 'width:100%;height:220px;object-fit:cover;';
                } else {
                    cover = document.createElement('div');
                    cover.className = 'blog-img-placeholder';
                    cover.style.background = gradients[idx];
                    const ic = document.createElement('i');
                    ic.className = 'fa-solid ' + icons[idx];
                    cover.appendChild(ic);
                }
                article.insertBefore(cover, article.firstChild);

                article.querySelector('.blog-tag').textContent = tag;
                article.querySelector('.blog-title').textContent = post.title || '';
                article.querySelector('.blog-excerpt').textContent = post.summary || '';
                article.querySelector('.blog-author-name').textContent = post.author || 'Dr. Cahit Cenksoy';
                article.querySelector('.blog-date').textContent = post.date || '';
                return article;
            }

            function filterBlog() {
                const q    = searchInput ? searchInput.value.toLowerCase().trim() : '';
                const cat  = (document.querySelector('.blog-cat-btn.active') || {}).dataset?.filter || 'all';
                const cards = document.querySelectorAll('.blog-card');
                let count  = 0;

                cards.forEach(card => {
                    const title   = (card.querySelector('.blog-title')?.innerText  || '').toLowerCase();
                    const excerpt = (card.querySelector('.blog-excerpt')?.innerText || '').toLowerCase();
                    const catMatch = cat === 'all' || card.dataset.category === cat;
                    const qMatch   = !q   || title.includes(q) || excerpt.includes(q);
                    const show     = catMatch && qMatch;
                    card.style.display = show ? 'flex' : 'none';
                    if (show) count++;
                });

                if (counterDiv) counterDiv.innerText = `Toplam ${count} makale listeleniyor`;
                if (noResultsDiv) noResultsDiv.style.display = count === 0 ? 'block' : 'none';
            }

            async function loadPosts() {
                grid.innerHTML = '<p style="text-align:center;color:var(--text-muted);padding:40px;">Makaleler yükleniyor...</p>';

                try {
                    const q = query(collection(db, "blog"), orderBy("date", "desc"));
                    const querySnapshot = await getDocs(q);
                    
                    grid.innerHTML = '';
                    let count = 0;
                    
                    querySnapshot.forEach((doc) => {
                        const post = doc.data();
                        if(post.status === "published") {
                            post.id = doc.id;
                            grid.appendChild(buildCard(post));
                            count++;
                        }
                    });
                    
                    if (count === 0) {
                        if (noResultsDiv) noResultsDiv.style.display = 'block';
                        if (counterDiv)   counterDiv.innerText = 'Toplam 0 makale listeleniyor';
                    }
                    filterBlog();
                } catch(e) {
                    console.error("Blog verileri çekilemedi:", e);
                    grid.innerHTML = '<p style="text-align:center;color:var(--text-muted);padding:40px;">Makaleler yüklenirken bir hata oluştu.</p>';
                }
            }

            if (grid) {
                grid.addEventListener('click', (e) => {
                    const card = e.target.closest('.blog-card');
                    if (card) {
                        const postId = card.dataset.id;
                        window.location.href = `blog-post.html?id=${postId}`;
                    }
                });
            }
            if (searchInput) searchInput.addEventListener('input', filterBlog);
            catBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    catBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    filterBlog();
                });
            });

            loadPosts();
        });
    </script>

</body>
