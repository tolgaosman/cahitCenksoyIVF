<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://*.google.com https://translate.googleapis.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com https://www.gstatic.com; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https:; connect-src 'self' https://*.googleapis.com https://*.google.com https://cahit-cenksoy-admin.onrender.com; frame-src https://*.google.com; object-src 'none'; base-uri 'self'">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Contact Us | Dr. Cahit Cenksoy IVF Clinic</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="browserLogo.png?v=1.1">
    <link rel="stylesheet" href="style.css?v=5.0">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="site-header"></div>
    <!-- Spacer for fixed navbar -->
    <div style="height: 80px;"></div>
    <!-- Contact Section -->
    <section class="section">
        <div class="container">
            <div class="section-header" style="text-align: center; margin-bottom: 40px;">
                <h2 data-i18n="navContact">İletişim & Randevu</h2>
                <div class="header-line" style="margin: 20px auto;"></div>
            </div>
            
            <div class="grid-2" style="gap: 30px; align-items: start;">
                <!-- Left: Appointment Form -->
                <div class="contact-form-wrapper" style="background: var(--card-bg); padding: 30px; border-radius: 20px; box-shadow: var(--shadow-md); border: 1px solid var(--border-color);">
                    <h3 style="margin-bottom: 20px; color: var(--primary-color); border-bottom: 2px solid var(--primary-color); padding-bottom: 10px; display: inline-block;">Randevu Formu</h3>
                    <form id="appointmentForm" class="contact-form">
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;">
                            <div class="form-group">
                                <label style="font-size: 0.85rem; font-weight: 600;">Kadın Yaşı</label>
                                <input type="text" id="female_age" name="female_age" required placeholder="Female Age" style="width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; background: var(--bg-light);">
                            </div>
                            <div class="form-group">
                                <label style="font-size: 0.85rem; font-weight: 600;">Erkek Yaşı</label>
                                <input type="text" id="male_age" name="male_age" required placeholder="Male Age" style="width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; background: var(--bg-light);">
                            </div>
                        </div>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;">
                            <div class="form-group">
                                <label style="font-size: 0.85rem; font-weight: 600;">Kan Grubu (K)</label>
                                <select id="blood_f" name="blood_f" required style="width: 100%; padding: 12px; border: none; border-radius: 8px; background: var(--bg-light); color: var(--text-main); font-family: inherit; font-size: 0.9rem; cursor: pointer; transition: background 0.3s ease; box-shadow: 0 2px 5px rgba(0,0,0,0.03);">
                                    <option value="" disabled selected>Grup Seçiniz</option>
                                    <option value="A+">A Rh(+)</option>
                                    <option value="A-">A Rh(-)</option>
                                    <option value="B+">B Rh(+)</option>
                                    <option value="B-">B Rh(-)</option>
                                    <option value="AB+">AB Rh(+)</option>
                                    <option value="AB-">AB Rh(-)</option>
                                    <option value="0+">0 Rh(+)</option>
                                    <option value="0-">0 Rh(-)</option></select>
                            </div>
                            <div class="form-group">
                                <label style="font-size: 0.85rem; font-weight: 600;">Kan Grubu (E)</label>
                                <select id="blood_m" name="blood_m" required style="width: 100%; padding: 12px; border: none; border-radius: 8px; background: var(--bg-light); color: var(--text-main); font-family: inherit; font-size: 0.9rem; cursor: pointer; transition: background 0.3s ease; box-shadow: 0 2px 5px rgba(0,0,0,0.03);">
                                    <option value="" disabled selected>Grup Seçiniz</option>
                                    <option value="A+">A Rh(+)</option>
                                    <option value="A-">A Rh(-)</option>
                                    <option value="B+">B Rh(+)</option>
                                    <option value="B-">B Rh(-)</option>
                                    <option value="AB+">AB Rh(+)</option>
                                    <option value="AB-">AB Rh(-)</option>
                                    <option value="0+">0 Rh(+)</option>
                                    <option value="0-">0 Rh(-)</option></select>
                            </div>
                        </div>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;">
                            <div class="form-group">
                                <label style="font-size: 0.85rem; font-weight: 600;">Boy (cm)</label>
                                <input type="text" id="size" name="size" required placeholder="Size" style="width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; background: var(--bg-light);">
                            </div>
                            <div class="form-group">
                                <label style="font-size: 0.85rem; font-weight: 600;">Kilo (kg)</label>
                                <input type="text" id="kilo" name="kilo" required placeholder="Kilo" style="width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; background: var(--bg-light);">
                            </div>
                        </div>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;">
                            <div class="form-group">
                                <label style="font-size: 0.85rem; font-weight: 600;">AMH Değeri</label>
                                <input type="text" id="amh" name="amh" required placeholder="AMH Value" style="width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; background: var(--bg-light);">
                            </div>
                            <div class="form-group">
                                <label style="font-size: 0.85rem; font-weight: 600;">Sperm Sonucu</label>
                                <input type="text" id="sperm" name="sperm" required placeholder="Sperm Result" style="width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; background: var(--bg-light);">
                            </div>
                        </div>
                        <div class="form-group" style="margin-bottom: 15px;">
                            <label style="font-size: 0.85rem; font-weight: 600;">Evlilik Süresi / Çocuk Deneme Süresi</label>
                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                                <input type="text" id="marriage" name="marriage" required placeholder="Marriage Period" style="width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; background: var(--bg-light);">
                                <input type="text" id="trying" name="trying" required placeholder="Pregnancy Prompt" style="width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; background: var(--bg-light);">
                            </div>
                        </div>
                        <div class="form-group" style="margin-bottom: 15px;">
                            <label style="font-size: 0.85rem; font-weight: 600;">Daha Önce Test Yapıldı mı?</label>
                            
                            <div style="display: flex; gap: 30px; align-items: center; padding: 5px 0;">
                                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 0.9rem;">
                                    <input type="radio" name="test_done" value="Evet" required style="width: 18px; height: 18px; accent-color: var(--primary-color);"> Evet
                                </label>
                                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 0.9rem;">
                                    <input type="radio" name="test_done" value="Hayır" style="width: 18px; height: 18px; accent-color: var(--primary-color);"> Hayır
                                </label>
                            </div>
                        </div>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;">
                            <div class="form-group">
                                <label style="font-size: 0.85rem; font-weight: 600;">E-posta</label>
                                <input type="text" id="app_email" name="email" required placeholder="Your email address" style="width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; background: var(--bg-light);">
                            </div>
                            <div class="form-group">
                                <label style="font-size: 0.85rem; font-weight: 600;">Telefon</label>
                                <input type="text" id="app_phone" name="phone" required placeholder="Your telephone number" style="width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; background: var(--bg-light);">
                            </div>
                        </div>
                        <button type="submit" id="appointmentSubmit" class="btn btn-primary" style="width: 100%; padding: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px;" disabled><i class="fa-brands fa-whatsapp"></i> WhatsApp'tan Ulaşın</button>
                    </form>
                </div>

                <!-- Right: Shrunk Contact Form -->
                <div class="contact-form-wrapper" style="background: var(--card-bg); padding: 30px; border-radius: 20px; box-shadow: var(--shadow-sm); border: 1px solid var(--border-color);">
                    <h3 style="margin-bottom: 20px; color: var(--secondary-color); border-bottom: 2px solid var(--secondary-color); padding-bottom: 10px; display: inline-block;">İletişim Formu</h3>
                    <form id="contactMsgForm" class="contact-form">
                        <div class="form-group" style="margin-bottom: 15px;">
                            <label for="name" style="font-size: 0.85rem; font-weight: 600;">Ad Soyad</label>
                            <input type="text" id="contact_name" name="name" required style="width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; background: var(--bg-light);">
                        </div>
                        <div class="form-group" style="margin-bottom: 15px;">
                            <label for="email" style="font-size: 0.85rem; font-weight: 600;">E-posta</label>
                            <input type="email" id="contact_email" name="email" required style="width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; background: var(--bg-light);">
                        </div>
                        <div class="form-group" style="margin-bottom: 20px;">
                            <label for="message" style="font-size: 0.85rem; font-weight: 600;">Mesajınız</label>
                            <textarea id="contact_message" name="message" rows="5" required style="width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; background: var(--bg-light); resize: none;"></textarea>
                        </div>
                        <button type="submit" id="contactSubmit" class="btn btn-primary" style="width: 100%; padding: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px;" disabled><i class="fa-brands fa-whatsapp"></i> WhatsApp'tan Ulaşın</button>
                    </form>
                </div>
            </div>
        </div>
    </section>
    <!-- Footer -->
    <div id="site-footer"></div>
    
    <script src="components.js"></script>
    <script src="translations.js"></script>
    <script src="app.js?v=5.0"></script>
    <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <script>
    function validateForm(formId, btnId) {
        const form = document.getElementById(formId);
        const btn = document.getElementById(btnId);
        const inputs = form.querySelectorAll("input, select, textarea");
        let isValid = true;

        inputs.forEach(input => {
            if (input.type === "radio") {
                const checked = form.querySelector(`input[name="${input.name}"]:checked`);
                if (!checked) isValid = false;
            } else if (input.tagName === "SELECT") {
                if (!input.value) isValid = false;
            } else {
                if (input.value.trim().length < 2) isValid = false;
            }
        });

        btn.disabled = !isValid;
        btn.style.opacity = isValid ? "1" : "0.5";
        btn.style.cursor = isValid ? "pointer" : "not-allowed";
    }

    ["appointmentForm", "contactMsgForm"].forEach(formId => {
        const btnId = formId === "appointmentForm" ? "appointmentSubmit" : "contactSubmit";
        const form = document.getElementById(formId);
        form.addEventListener("input", () => validateForm(formId, btnId));
        // Run once on load
        validateForm(formId, btnId);
    });

    document.getElementById("appointmentForm").addEventListener("submit", function(e) {
        e.preventDefault();
        const data = {
            "Kadın Yaşı": document.getElementById("female_age").value,
            "Erkek Yaşı": document.getElementById("male_age").value,
            "Kan Grubu (K)": document.getElementById("blood_f").value,
            "Kan Grubu (E)": document.getElementById("blood_m").value,
            "Boy": document.getElementById("size").value,
            "Kilo": document.getElementById("kilo").value,
            "AMH": document.getElementById("amh").value,
            "Sperm": document.getElementById("sperm").value,
            "Evlilik Süresi": document.getElementById("marriage").value,
            "Deneme Süresi": document.getElementById("trying").value,
            "Test Yapıldı mı?": document.querySelector('input[name="test_done"]:checked').value,
            "E-posta": document.getElementById("app_email").value,
            "Telefon": document.getElementById("app_phone").value
        };

        // 1) Formulate a detailed summary message for the admin panel
        let summaryMsg = "Randevu Detayları:\n";
        for (const key in data) {
            if (key !== "E-posta" && key !== "Telefon") {
                summaryMsg += `- ${key}: ${data[key]}\n`;
            }
        }

        // 2) Silently save the appointment request to the admin panel Inquiries
        fetch('https://cahit-cenksoy-admin.onrender.com/api/basvuru', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                name: "Randevu Talebi (Tüp Bebek)",
                email: data["E-posta"],
                phone: data["Telefon"],
                message: summaryMsg
            })
        }).catch(() => {});

        // 3) Open WhatsApp as before
        let text = "*YENİ RANDEVU TALEBİ*\n\n";
        for (const key in data) { text += `*${key}:* ${data[key]}\n`; }
        window.open(`https://wa.me/905488880112?text=${encodeURIComponent(text)}`, "_blank");
    });

    document.getElementById("contactMsgForm").addEventListener("submit", function(e) {
        e.preventDefault();
        const name    = document.getElementById("contact_name").value;
        const email   = document.getElementById("contact_email").value;
        const message = document.getElementById("contact_message").value;

        // Silently save to admin panel inquiries
        fetch('https://cahit-cenksoy-admin.onrender.com/api/basvuru', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: name, email: email, message: message })
        }).catch(() => {});

        // Open WhatsApp as usual
        let text = `*YEN\u0130 \u0130LET\u0130\u015e\u0130M MESAJI*\n\n*Ad Soyad:* ${name}\n*E-posta:* ${email}\n*Mesaj:* ${message}`;
        window.open(`https://wa.me/905488880112?text=${encodeURIComponent(text)}`, "_blank");
    });
    </script>
</body>
</html>
