<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://*.google.com https://translate.googleapis.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com https://www.gstatic.com; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https:; connect-src 'self' https://*.googleapis.com https://*.google.com https://cahit-cenksoy-admin.onrender.com; frame-src https://*.google.com; object-src 'none'; base-uri 'self'">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Ekibimiz | Dr. Cahit Cenksoy IVF Clinic</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="browserLogo.png?v=1.1">
    <link rel="stylesheet" href="style.css?v=5.2">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="site-header"></div>
    <!-- Spacer for fixed navbar -->
    <div style="height: 80px;"></div>
    
    <!-- Team Grid Section -->
    <section class="section">
        <div class="container">
            <div class="section-header">
                <h2 data-i18n="teamTitle">EKİBİMİZ</h2>
                <div class="header-line"></div>
            </div>
            <div class="team-grid-full" id="teamGrid">
                <p style="text-align:center; color:var(--text-muted); width: 100%; grid-column: 1/-1; padding: 50px 0;">
                    <i class="fa-solid fa-spinner fa-spin" style="font-size: 2rem; color:var(--primary-color); margin-bottom: 15px;"></i><br>
                    Ekibimiz yükleniyor...
                </p>
            </div>
        </div>
    </section>
    <!-- Footer -->
    <div id="site-footer"></div>
    <a href="https://wa.me/905488880112" class="whatsapp-float" target="_blank" rel="noopener noreferrer">
        <i class="fa-brands fa-whatsapp"></i>
    </a>
    <script src="components.js"></script>
    <script src="translations.js"></script>
    <script src="app.js?v=5.2"></script>
    <script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    
    <!-- Dynamic Team Loading Script from Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCRGvbp9E30tE_0-FTr4Oq1DnoteEdwtfI",
            authDomain: "in-vitro-fertilization-154m9k.firebaseapp.com",
            projectId: "in-vitro-fertilization-154m9k",
            storageBucket: "in-vitro-fertilization-154m9k.appspot.com",
            messagingSenderId: "73069645780",
            appId: "1:73069645780:web:6d6f7a21a1d1ac26bd1041"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // GÜVENLİK: Firestore içeriğini innerHTML yerine güvenli DOM (textContent) ile bas.
        // Tüm ekip alanları düz metin olduğundan XSS (örn. bio'ya gömülü <script>) çalışamaz.
        function buildTeamCard(m) {
            const detailRows = [
                ['fa-language', m.lang],
                ['fa-graduation-cap', m.bachelors],
                ['fa-user-graduate', m.masters],
                ['fa-file-lines', m.thesis],
                ['fa-briefcase', m.experience],
                ['fa-stethoscope', m.expertise],
                ['fa-certificate', m.certificate]
            ];

            const details = document.createElement('div');
            details.style.cssText = 'font-size: 0.85rem; line-height: 1.4; text-align:left; width:100%; height:100%; overflow-y:auto; padding-right:5px;';

            let hasContent = false;
            detailRows.forEach(([icon, value]) => {
                if (!value) return;
                hasContent = true;
                const row = document.createElement('div');
                row.style.marginBottom = '6px';
                const i = document.createElement('i');
                i.className = 'fa-solid ' + icon;
                i.style.cssText = 'color:var(--primary-color); width:15px; margin-right:5px;';
                row.appendChild(i);
                row.appendChild(document.createTextNode(' ' + value));
                details.appendChild(row);
            });
            if (m.bio) {
                hasContent = true;
                const bio = document.createElement('div');
                bio.style.cssText = 'margin-top:10px; padding-top:10px; border-top:1px solid rgba(255,255,255,0.2)';
                bio.textContent = m.bio;
                details.appendChild(bio);
            }
            if (!hasContent) {
                const empty = document.createElement('div');
                empty.style.textAlign = 'center';
                empty.textContent = 'Biyografi henüz eklenmedi.';
                details.appendChild(empty);
            }

            const img = document.createElement('img');
            img.src = m.imageUrl || 'cahit.jpg';
            img.alt = m.name || '';
            img.setAttribute('onerror', "this.onerror=null; this.src='cahit.jpg';");

            const overlayInner = document.createElement('div');
            overlayInner.appendChild(details);
            const overlay = document.createElement('div');
            overlay.className = 'team-overlay';
            overlay.appendChild(overlayInner);

            const teamImg = document.createElement('div');
            teamImg.className = 'team-img';
            teamImg.appendChild(img);
            teamImg.appendChild(overlay);

            const name = document.createElement('h3');
            name.textContent = m.name || '';
            const role = document.createElement('p');
            role.textContent = m.role || '';
            const info = document.createElement('div');
            info.className = 'team-info';
            info.appendChild(name);
            info.appendChild(role);

            const card = document.createElement('div');
            card.className = 'team-card';
            card.appendChild(teamImg);
            card.appendChild(info);
            return card;
        }

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const q = query(collection(db, "team"), orderBy("sortOrder", "asc"));
                const querySnapshot = await getDocs(q);
                const grid = document.getElementById('teamGrid');
                grid.innerHTML = '';

                if (querySnapshot.empty) {
                    grid.innerHTML = '<p style="text-align:center; color:var(--text-muted); width:100%; grid-column:1/-1;">Ekip üyesi bulunamadı.</p>';
                    return;
                }

                querySnapshot.forEach((doc) => {
                    grid.appendChild(buildTeamCard(doc.data()));
                });
            } catch(err) {
                console.error("Ekip yüklenirken hata:", err);
                document.getElementById('teamGrid').innerHTML = '<p style="text-align:center; color:var(--text-muted); width:100%; grid-column:1/-1;">Ekip bilgileri yüklenemedi.</p>';
            }
        });
    </script>
</body>
</html>
