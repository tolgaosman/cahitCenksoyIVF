<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ekibimiz | Dr. Cahit Cenksoy IVF Clinic</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="browserLogo.png?v=1.1">
    <link rel="stylesheet" href="style.css?v=4.15">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="site-header"></div>
    <!-- Spacer for fixed navbar -->
    <div style="height: 80px;"></div>
    
    <!-- Team Grid Section -->
    <section class="section">
        <div class="container">
            <div class="section-header">
                <h2 data-i18n="teamTitle">EKİBİMİZ</h2>
                <div class="header-line"></div>
            </div>
            <div class="team-grid-full" id="teamGrid">
                <p style="text-align:center; color:var(--text-muted); width: 100%; grid-column: 1/-1; padding: 50px 0;">
                    <i class="fa-solid fa-spinner fa-spin" style="font-size: 2rem; color:var(--primary-color); margin-bottom: 15px;"></i><br>
                    Ekibimiz yükleniyor...
                </p>
            </div>
        </div>
    </section>
    <!-- Footer -->
    <div id="site-footer"></div>
    <a href="https://wa.me/905488880112" class="whatsapp-float" target="_blank" rel="noopener noreferrer">
        <i class="fa-brands fa-whatsapp"></i>
    </a>
    <script src="components.js"></script>
    <script src="translations.js"></script>
    <script src="app.js?v=4.13"></script>
    <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    
    <!-- Dynamic Team Loading Script from Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCRGvbp9E30tE_0-FTr4Oq1DnoteEdwtfI",
            authDomain: "in-vitro-fertilization-154m9k.firebaseapp.com",
            projectId: "in-vitro-fertilization-154m9k",
            storageBucket: "in-vitro-fertilization-154m9k.appspot.com",
            messagingSenderId: "73069645780",
            appId: "1:73069645780:web:6d6f7a21a1d1ac26bd1041"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const q = query(collection(db, "team"), orderBy("sortOrder", "asc"));
                const querySnapshot = await getDocs(q);
                const grid = document.getElementById('teamGrid');
                grid.innerHTML = '';
                
                if (querySnapshot.empty) {
                    grid.innerHTML = '<p style="text-align:center; color:var(--text-muted); width:100%; grid-column:1/-1;">Ekip üyesi bulunamadı.</p>';
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const m = doc.data();
                    const imgSrc = m.imageUrl || 'cahit.jpg';
                    
                    let detailsHtml = '';
                    if(m.lang) detailsHtml += `<div style="margin-bottom:6px;"><i class="fa-solid fa-language" style="color:var(--primary-color); width:15px; margin-right:5px;"></i> ${m.lang}</div>`;
                    if(m.bachelors) detailsHtml += `<div style="margin-bottom:6px;"><i class="fa-solid fa-graduation-cap" style="color:var(--primary-color); width:15px; margin-right:5px;"></i> ${m.bachelors}</div>`;
                    if(m.masters) detailsHtml += `<div style="margin-bottom:6px;"><i class="fa-solid fa-user-graduate" style="color:var(--primary-color); width:15px; margin-right:5px;"></i> ${m.masters}</div>`;
                    if(m.thesis) detailsHtml += `<div style="margin-bottom:6px;"><i class="fa-solid fa-file-lines" style="color:var(--primary-color); width:15px; margin-right:5px;"></i> ${m.thesis}</div>`;
                    if(m.experience) detailsHtml += `<div style="margin-bottom:6px;"><i class="fa-solid fa-briefcase" style="color:var(--primary-color); width:15px; margin-right:5px;"></i> ${m.experience}</div>`;
                    if(m.expertise) detailsHtml += `<div style="margin-bottom:6px;"><i class="fa-solid fa-stethoscope" style="color:var(--primary-color); width:15px; margin-right:5px;"></i> ${m.expertise}</div>`;
                    if(m.certificate) detailsHtml += `<div style="margin-bottom:6px;"><i class="fa-solid fa-certificate" style="color:var(--primary-color); width:15px; margin-right:5px;"></i> ${m.certificate}</div>`;
                    if(m.bio) detailsHtml += `<div style="margin-top:10px; padding-top:10px; border-top:1px solid rgba(255,255,255,0.2)">${m.bio}</div>`;
                    
                    if(detailsHtml === '') detailsHtml = '<div style="text-align:center;">Biyografi henüz eklenmedi.</div>';
                    
                    grid.innerHTML += `
                        <div class="team-card">
                            <div class="team-img">
                                <img src="${imgSrc}" alt="${m.name}" onerror="this.onerror=null; this.src='cahit.jpg';">
                                <div class="team-overlay">
                                    <div style="font-size: 0.85rem; line-height: 1.4; text-align:left; width:100%; height:100%; overflow-y:auto; padding-right:5px;">
                                        ${detailsHtml}
                                    </div>
                                </div>
                            </div>
                            <div class="team-info">
                                <h3>${m.name}</h3>
                                <p>${m.role}</p>
                            </div>
                        </div>
                    `;
                });
            } catch(err) {
                console.error("Ekip yüklenirken hata:", err);
                document.getElementById('teamGrid').innerHTML = '<p style="text-align:center; color:var(--text-muted); width:100%; grid-column:1/-1;">Ekip bilgileri yüklenemedi.</p>';
            }
        });
    </script>
</body>
</html>
