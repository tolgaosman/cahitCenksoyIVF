<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ post.title }} | Dr. Cahit Cenksoy</title>
    <meta name="description" content="{{ post.summary or post.title }}">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css?v=3.1">
    <style>
        .post-content {
            max-width: 760px;
            margin: 0 auto;
            line-height: 1.9;
            font-size: 1.05rem;
            color: var(--text-main);
        }
        .post-content h2 { font-size: 1.6rem; margin: 36px 0 16px; color: var(--text-main); }
        .post-content h3 { font-size: 1.25rem; margin: 28px 0 12px; }
        .post-content p  { margin-bottom: 18px; }
        .post-content ul,
        .post-content ol { padding-left: 24px; margin-bottom: 18px; }
        .post-content li { margin-bottom: 8px; }
        .post-content a  { color: var(--primary-color); text-decoration: underline; }
        .post-content blockquote {
            border-left: 3px solid var(--primary-color);
            margin: 24px 0;
            padding: 12px 24px;
            background: var(--bg-light);
            border-radius: 0 8px 8px 0;
            font-style: italic;
            color: var(--text-muted);
        }
        .post-hero-img {
            width: 100%;
            max-height: 420px;
            object-fit: cover;
            border-radius: 16px;
            margin-bottom: 40px;
            display: block;
        }
    </style>
</head>
<body>

    <!--
    ─── INTEGRATION NOTE ────────────────────────────────────────────────────────
    Copy your navbar HTML from index.html above this section.
    ─────────────────────────────────────────────────────────────────────────────
    -->

    <section class="section">
        <div class="container">

            <!-- Back link -->
            <a href="/blog"
               style="display:inline-flex;align-items:center;gap:6px;color:var(--text-muted);
                      font-size:.875rem;margin-bottom:32px;">
                ← Blog'a Dön
            </a>

            <!-- Post Header -->
            <div style="max-width:760px;margin:0 auto;">
                <span style="font-size:.8rem;color:var(--primary-color);font-weight:600;
                             text-transform:uppercase;letter-spacing:.06em;">
                    {{ post.date }}
                </span>
                <h1 style="font-size:2.4rem;font-weight:700;line-height:1.25;
                            margin:12px 0 20px;color:var(--text-main);">
                    {{ post.title }}
                </h1>
                {% if post.summary %}
                <p style="font-size:1.15rem;color:var(--text-muted);line-height:1.7;
                           margin-bottom:32px;border-left:3px solid var(--primary-color);
                           padding-left:16px;">
                    {{ post.summary }}
                </p>
                {% endif %}
            </div>

            <!-- Feature Image -->
            {% if post.image_path %}
            <img src="/static/{{ post.image_path }}"
                 alt="{{ post.title }}"
                 class="post-hero-img">
            {% endif %}

            <!-- Post Body — rendered as safe HTML from the rich-text editor -->
            <div class="post-content">
                {{ post.content | safe }}
            </div>

            <!-- Footer Divider -->
            <div style="max-width:760px;margin:60px auto 0;border-top:1px solid var(--border-color);
                        padding-top:28px;display:flex;align-items:center;justify-content:space-between;">
                <a href="/blog"
                   style="color:var(--primary-color);font-weight:600;font-size:.9rem;">
                    ← Tüm Yazılar
                </a>
                <a href="/contact.html"
                   style="background:var(--primary-color);color:white;padding:10px 22px;
                          border-radius:50px;font-weight:600;font-size:.875rem;text-decoration:none;">
                    Randevu Al
                </a>
            </div>

        </div>
    </section>

    <!--
    ─── INTEGRATION NOTE ────────────────────────────────────────────────────────
    Copy your footer HTML from index.html below this section.
    ─────────────────────────────────────────────────────────────────────────────
    -->

</body>
</html>
