<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog | Dr. Cahit Cenksoy</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css?v=3.1">
</head>
<body>
    <!-- This template extends your existing static site's nav/footer.
         For full integration, copy the nav & footer HTML from your index.html here.
         Below shows the dynamic data injection using Jinja2. -->

    <section class="section">
        <div class="container">
            <div class="section-header">
                <h2>Blog</h2>
                <div class="header-line"></div>
            </div>

            {% if posts %}
            <div class="grid-3" style="margin-top:40px;">
                {% for post in posts %}
                <article class="blog-card" style="
                    background: var(--card-bg);
                    border: 1px solid var(--border-color);
                    border-radius: 15px;
                    overflow: hidden;
                    box-shadow: var(--shadow-sm);
                    transition: var(--transition);
                    display: flex;
                    flex-direction: column;
                ">
                    {% if post.image_path %}
                    <a href="/blog/{{ post.slug }}">
                        <img src="/static/{{ post.image_path }}"
                             alt="{{ post.title }}"
                             style="width:100%;height:200px;object-fit:cover;display:block;">
                    </a>
                    {% endif %}

                    <div style="padding:24px;flex:1;display:flex;flex-direction:column;gap:12px;">
                        <span style="font-size:.75rem;color:var(--primary-color);font-weight:600;text-transform:uppercase;letter-spacing:.06em;">
                            {{ post.date }}
                        </span>
                        <h3 style="font-size:1.15rem;font-weight:700;line-height:1.35;">
                            <a href="/blog/{{ post.slug }}" style="color:var(--text-main);">
                                {{ post.title }}
                            </a>
                        </h3>
                        {% if post.summary %}
                        <p style="color:var(--text-muted);font-size:.9rem;line-height:1.6;">
                            {{ post.summary }}
                        </p>
                        {% endif %}
                        <a href="/blog/{{ post.slug }}"
                           style="margin-top:auto;display:inline-flex;align-items:center;gap:6px;
                                  color:var(--primary-color);font-weight:600;font-size:.875rem;">
                            Devamını Oku →
                        </a>
                    </div>
                </article>
                {% endfor %}
            </div>

            {% else %}
            <p style="text-align:center;color:var(--text-muted);padding:60px 0;">
                Henüz yayınlanmış blog yazısı bulunmuyor.
            </p>
            {% endif %}
        </div>
    </section>
</body>
</html>
