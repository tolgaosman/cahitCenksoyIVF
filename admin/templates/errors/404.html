<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Sayfa Bulunamadı</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg:#0d0d0d; --text:#e2e8f0; --muted:#64748b; --primary:#d291bc; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Outfit',sans-serif; background:var(--bg); color:var(--text);
               min-height:100vh; display:flex; align-items:center; justify-content:center; text-align:center; }
        .num { font-size:8rem; font-weight:700; color:var(--primary); opacity:.15; line-height:1; }
        h1 { font-size:1.5rem; margin-bottom:8px; }
        p  { color:var(--muted); margin-bottom:28px; }
        a  { display:inline-block; padding:10px 24px; background:var(--primary); color:#1a0a14;
             border-radius:9px; font-weight:700; text-decoration:none; }
    </style>
</head>
<body>
    <div>
        <div class="num">404</div>
        <h1>Sayfa Bulunamadı</h1>
        <p>Aradığınız sayfa mevcut değil veya taşınmış olabilir.</p>
        <a href="/">Ana Sayfaya Dön</a>
    </div>
</body>
</html>
