<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sitedeki Verileri Firebase'e Aktar</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f8f9fa; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 500px; text-align: center; }
        button { background: #3498db; color: white; border: none; padding: 12px 24px; border-radius: 6px; font-size: 1rem; cursor: pointer; width: 100%; margin-top: 20px;}
        button:hover { background: #2980b9; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        #log { margin-top: 20px; text-align: left; font-size: 0.85rem; color: #555; background: #eee; padding: 10px; border-radius: 5px; max-height: 200px; overflow-y: auto; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Verileri Firebase'e Aktar</h2>
        <p>Eski sistemdeki Ekip Üyeleri, Sıkça Sorulan Sorular ve Site Bilgileri Firebase'e aktarılacak.</p>
        
        <input type="email" id="email" placeholder="Admin E-posta adresiniz">
        <input type="password" id="password" placeholder="Şifreniz">
        
        <button id="start-btn">Aktarımı Başlat</button>
        <div id="log">Bekleniyor...</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, addDoc, collection } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCRGvbp9E30tE_0-FTr4Oq1DnoteEdwtfI",
            authDomain: "in-vitro-fertilization-154m9k.firebaseapp.com",
            projectId: "in-vitro-fertilization-154m9k",
            storageBucket: "in-vitro-fertilization-154m9k.appspot.com",
            messagingSenderId: "73069645780",
            appId: "1:73069645780:web:6d6f7a21a1d1ac26bd1041"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const logEl = document.getElementById('log');
        function log(msg) {
            logEl.innerHTML += `<div>${msg}</div>`;
            logEl.scrollTop = logEl.scrollHeight;
        }

        const siteData = {
            phone1: '+90 548 888 0 112',
            phone2: '+90 542 888 0 112',
            email1: 'c_cenksoy@hotmail.com',
            email2: 'ufukozbas0675@gmail.com',
            address: 'Nicosia IVF - Nicosia Sevinç Hospital',
            instagram: 'https://www.instagram.com/drcahitcenksoy/',
            facebook: 'https://www.facebook.com/p/Dr-Cahit-Cenksoy-100064112829620/'
        };

        const teamData = [
            { name: 'Op. Dr. Cahit Cenksoy', role: 'Kadın Hastalıkları, Doğum Ve Tüp Bebek Uzmanı', imageUrl: 'cahit.jpg', sortOrder: 1, bio: "Dr. Cahit Cenksoy, Kıbrıs'ta en yüksek tüp bebek başarı oranına sahip, en genç, en tecrübeli ve en başarılı Kadın Doğum Uzmanlarından biridir." },
            { name: 'Hayriye Karakaya', role: 'Embriyolog', imageUrl: 'hayriye.jpg', sortOrder: 2, bio: "Dil: İngilizce – Bulgarca – İspanyolca" },
            { name: 'Güneş Özbaş', role: 'Yabancı Hasta Koordinatörü', imageUrl: 'gunes.jpg', sortOrder: 3, bio: "Deneyim: 9 Yıl Bankacılık + 1 Yıl Yabancı Hasta Koordinatörlüğü" },
            { name: 'Gülseren Akbal', role: 'Tıbbi Dokümantasyon Ve Sekreter', imageUrl: 'gulseren.jpg', sortOrder: 4, bio: "Eğitim: Yakın Doğu Üniversitesi Tıp Fakültesi" },
            { name: 'Selcan Yüksel Çay', role: 'Hasta Koordinatörü', imageUrl: 'selcan.jpg', sortOrder: 5, bio: "Sertifika: Özel İş Yeri Hemşireliği" },
            { name: 'Zekiye Niyazi', role: 'Teknik Personel', imageUrl: 'zekiye.jpg', sortOrder: 6, bio: "Zekiye Niyazi, 5 yıldır ekibimizin ayrılmaz bir parçasıdır." },
            { name: 'Elham Morandi', role: 'Hemşire', imageUrl: 'elham.jpg', sortOrder: 7, bio: "Dil: Farsça - Türkçe - İngilizce" }
        ];

        document.getElementById('start-btn').addEventListener('click', async () => {
            const email = document.getElementById('email').value;
            const pwd = document.getElementById('password').value;
            if(!email || !pwd) return alert("E-posta ve şifre girin.");
            
            document.getElementById('start-btn').disabled = true;
            log("Giriş yapılıyor...");

            try {
                await signInWithEmailAndPassword(auth, email, pwd);
                log("Giriş başarılı! Veriler aktarılıyor...");

                // 1. Site Ayarları
                log("Site ayarları yükleniyor...");
                await setDoc(doc(db, "settings", "general"), siteData);
                
                // 2. Ekip Üyeleri
                log("Ekip üyeleri yükleniyor (7 kişi)...");
                for(let t of teamData) {
                    await addDoc(collection(db, "team"), t);
                }

                // 3. FAQs (Fetch from json)
                log("SSS (Sıkça Sorulan Sorular) yükleniyor...");
                try {
                    const response = await fetch('admin/faqs_seed.json');
                    const faqs = await response.json();
                    let count = 0;
                    for(let f of faqs) {
                        await addDoc(collection(db, "faqs"), {
                            question: f.question,
                            answer: f.answer,
                            sortOrder: f.sort_order || 10
                        });
                        count++;
                    }
                    log(`${count} adet soru yüklendi.`);
                } catch(err) {
                    log("Uyarı: SSS dosyası okunamadı (lokal sunucu gerekebilir), diğer veriler yüklendi.");
                }

                log("<br><strong>TÜM İŞLEMLER BAŞARIYLA TAMAMLANDI! 🎉</strong>");
                log("Artık bu sayfayı kapatabilir ve admin-panel.html'ye dönebilirsiniz.");
            } catch(e) {
                log(`<span style="color:red">Hata oluştu: ${e.message}</span>`);
            }
        });
    </script>
</body>
</html>
