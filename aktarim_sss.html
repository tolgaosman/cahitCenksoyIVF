        const faqs = [
          {"question": "Tüp bebek nedir?", "answer": "Farklı nedenlerle kısırlık sorunu yaşayan çiftlerin gebe kalmaları için uygulanan en etkili tedavidir. Bu tedavide yumurta ile sperm laboratuvar ortamında bir araya getirilir ve oluşturulan embriyo/lar anne rahmine yerleştirilir.", "sort_order": 0},
          {"question": "Tüp bebek tedavisinin aşamaları nelerdir?", "answer": "Tedavi öncesi çiftin ve test sonuçlarının değerlendirilmesi ile başlar. Sonraki adımlar sırasıyla yumurtaların büyütülmesi, yumurta toplama ve embriyo transferidir. Yumurtaların toplanmasından sonra laboratuvar ortamında döllenmesi, gerekli ise PGD veya NGS gibi genetik tanılar haricinde embriyoların takibi yapılır.", "sort_order": 1},
          {"question": "Tüp bebek doğumsal anomali şansını artırır mı?", "answer": "Tüp bebek ile oluşturulan gebeliklerde genetik anomali ihtimali artmamaktadır. Bunun nedeni tüp bebek tedavisinin ileri yaştaki kadınlara daha sık uygulanıyor olmasıdır. Tüp bebek yapılırken genetik tanı testleri ile bu anomali ihtimalleri azaltılır.", "sort_order": 2},
          {"question": "Tüp bebek tedavisi öncesinde hangi testler istenmelidir?", "answer": "Kısırlık tanısı konmuş olan veya özel bir durum sebebiyle (genetik hastalıklar - tekrarlayan düşükler - cinsiyet belirleme) tüp bebek tedavisi planlanan çifte; rahim filmi, kadın ve erkeğe ait kan testleri ve spermiyogram testleri yapılır. Gerekli görülürse karyotip (genetik analiz) ve sperm DNA hasarı dahil birçok özel test yapılabilir.", "sort_order": 3},
          {"question": "Yumurtalık (over) rezervi nedir?", "answer": "Bir kadının yumurtalıklarında kalan yumurta miktarıdır.", "sort_order": 4},
          {"question": "Yumurtalık (over) rezervi nasıl ölçülür?", "answer": "Güncel bilgilerimizle over rezervini değerlendirirken kanda AMH (anti müllerian hormon) testi ve ultrason ile yumurtalıklardaki antral foliküllerin sayısına bakıyoruz. Adetin 2. veya 3. günü FSH ve Östrojen hormon düzeyleri tutarsız olduğunda artık birincil gösterge olarak kullanılmazlar.", "sort_order": 5},
          {"question": "Yumurta toplama (OPU) nasıl yapılır?", "answer": "Yumurta toplama ağrılı bir işlem olduğundan anestezi altında yapılması önerilir. Vajenden ultrason kılavuzluğunda ince bir iğne ile yumurtalıklara ulaşılır. Foliküllerdeki sıvı ile birlikte yumurtalar vücut dışına alınır.", "sort_order": 6},
          {"question": "Yumurta toplama ağrılı bir işlem midir?", "answer": "Tek bir folikül var ise herhangi bir iğne kadar can yakar fakat yumurta sayısı fazla ise anestezi altında yapılması önerilir.", "sort_order": 7},
          {"question": "Yumurta toplama işleminden sonra tüp bebek merkezinde kaç saat kalınmalıdır?", "answer": "Yumurta toplama sedasyon dediğimiz yüzeysel ve kısa süreli bir anestezi yöntemi ile yapılır (sedoanaljezi). İlaç etkisi ilacı kestikten birkaç dakika sonra sona erer ve hasta uyanır. Uyanma sonrası adet sancısına benzer bir kasık ağrısı olabilir. Genellikle 1-2 saat sonra hasta evine gidebilir.", "sort_order": 8},
          {"question": "Tüp bebek tedavisinde kullanılan hormon ilaçları kansere neden olur mu?", "answer": "Yapılan geniş çalışmalarda tüp bebek tedavisi uygulanan hastalarda yumurtalık kanseri dahil hiçbir kanser türünün artmadığı ortaya konmuştur.", "sort_order": 9},
          {"question": "Kaç tane embriyo transfer edilmelidir?", "answer": "Transfer edilen her embriyo tek seferde gebe kalma şansınızı artırır. Bunun yanında transfer edilen her embriyo çoğul gebelik riskini artırmaktadır. En uygun embriyo sayısına karar verilirken embriyoların kalitesi, anne adayının yaşı, toplamda kaç embriyo olduğu, embriyoların genetik tanısının olup olmadığı, önceki IVF sonuçları gibi birçok faktörün yanında ailenin talebi de oldukça önemlidir. Kıbrıs'ta tüp bebek tedavisinde transfer edilecek embriyo sayısı bu koşullara göre belirlenir.", "sort_order": 10},
          {"question": "Çoğul gebelik olursa nasıl bir yol izlenir?", "answer": "İkiz gebelikler genellikle ailenin özel bir talebi olmaz ise takip edilir ve başarıyla doğurtulur. Üçüz gebeliklere ise erken doğum ve şiddetli büyüme gelişme geriliğine sebep olacağı için müdahale edilmelidir. Uygun bir haftada en sağlıksız gözüken embriyonun kalbi iğne ile anne karnından girilerek durdurulur. Bu karar tamamen aileye aittir.", "sort_order": 11},
          {"question": "Embriyo azaltma işlemi sırasında diğer bebekler zarar görebilir mi?", "answer": "Bu işlem konunun uzmanı doktorlar tarafından yapıldığı için bu risk oldukça az olmakla birlikte diğer embriyo/lar da müdahaleden zarar görebilir. Fakat kar zarar oranı düşünüldüğünde üçüz gebeliğin devamına karar vermek diğer iki bebeği de önemli ölçüde riske edeceğinden redüksiyon (azaltma) işlemi mutlaka önerilir.", "sort_order": 12},
          {"question": "Embriyo transferi sonrası hemen ayağa kalkılır mı?", "answer": "Embriyo transferi sonrası 15. dk'da ayağa kalkmak ile 2 saat sonra kalkmak arasında gebelik oranları açısından fark yoktur. Uzun süreli istirahatler vücudun kan akımını bozabilir. Normal yaşama devam edilmesini önermekteyiz.", "sort_order": 13},
          {"question": "Embriyo transferi sonrasında nasıl beslenilmelidir?", "answer": "Anne adayı transfer sonrasında mümkün oldukça doğal beslenmeli. Transfer öncesinde hangi miktarda yemek yiyorsa aynı miktarda beslenmeye devam etmelidir. Bitki çayları ve tropik meyveler gibi vücudun işleyişini değiştirebilecek besinlerden kaçınılmalıdır. Aşırı şekerli gıdalardan uzak durulmalıdır.", "sort_order": 14},
          {"question": "Embriyo transferi sonrası banyo yapılabilir mi?", "answer": "Embriyo transferi sonrasında çok soğuk ve çok sıcak banyo yapılması önerilmez. Ilık suyla ayakta duş şeklinde banyo yapılması daha doğru olacaktır. Transfer yapıldığı gün genellikle banyo yapılması önerilmemekle birlikte bu konuda kanıtlanmış bir şey yoktur.", "sort_order": 15},
          {"question": "Embriyo transferi sonrası cinsel ilişki zararlı mı?", "answer": "Gebelik testine kadar cinsel ilişki önerilmemekle birlikte bunun başarıyı etkilediği ile ilgili net bir bilgi mevcut değildir.", "sort_order": 16},
          {"question": "Embriyo transferi sonrası egzersiz / spor yapılabilir mi?", "answer": "Yine gebelik testine kadar egzersiz önerilmez fakat mutlak bir yatak istirahati de uygun olmayacaktır. Gebelik testi sonrası kısa yürüyüşler yapılabilir.", "sort_order": 17},
          {"question": "Tüp bebek tedavisinin tutup tutmadığı nasıl anlaşılır?", "answer": "Klasik gebelik belirtileri olan kasıklarda adet sancısı şeklindeki hafif ağrılar, memelerde hassasiyet, bulantı veya lekelenme tarzında vajinal kanama olabilir. Bunlara rağmen gebeliğin anlaşılmasının tek yolu kanda b-Hcg hormonunun ölçülmesidir.", "sort_order": 18},
          {"question": "Tüp bebek tedavisi ile doğan bebeklerde sağlık sorunlarında artış olur mu?", "answer": "Bugüne kadar tüp bebek tedavisi ile doğan çocukların sağlık sorunlarında artış izlenmemiştir.", "sort_order": 19},
          {"question": "Belirtilen zamanda ilacımı almayı unutursam aynı anda ikisini mi almalıyım?", "answer": "Hayır, sadece birkaç saat geç kaldıysanız hatırladığınız anda ilacınızı alın ve koordinatörünüzü bilgilendirin lütfen.", "sort_order": 20},
          {"question": "İğnelerimi kendim mi uygulamam gerekiyor?", "answer": "Çoğu iğneler kendi evinizin rahatlığında kendi kendinize uygulanır. Deri altına küçük bir iğne ile yapılır. Hemşiremiz size enjeksiyonun nasıl uygulanacağını gösterebilir görüntülü anlatımla da yapılabilir. Böylece klinikten uzakta enjeksiyon yapma konusunda kendinize güveneceksiniz.", "sort_order": 21},
          {"question": "Yumurta toplama işlemi nasıl oluyor?", "answer": "Size sakinleştirici ve ağrı kesici verilecektir. Yumurtalarınız ultrasound eşliğinde ucunda aspirasyon cihazı bulunan uzun bir iğne kullanılarak transvajinal olarak toplanır. Bu işlem genellikle 15-20 dakika sürer.", "sort_order": 22},
          {"question": "Tedavi ve başarı şansım nedir?", "answer": "Birkaç faktör tedaviden sonra başarı şansınızı etkileyebilir. Doktorumuz tıbbi geçmişinizi ve talep ettiğimiz kan testi sonuçlarınızı değerlendirdikten sonra sizinle başarı şansınızı görüşecektir.", "sort_order": 23},
          {"question": "Tedavim başarılı olmazsa ne olur?", "answer": "Döngünüz başarılı olmadıysa, doktorumuz sizinle olası nedenleri paylaşacaktır.", "sort_order": 24},
          {"question": "Eğer tedavim başarısız olursa ne kadar süre sonra tekrar deneyebilirim?", "answer": "Başka bir döngüye başlamadan önce vücudunuzun bir veya iki ay dinlenmesine izin vermenizi öneririz.", "sort_order": 25},
          {"question": "Transfer sonrası aynı gün evime dönebilir miyim?", "answer": "Evet, embriyo transferi sonrası evinize dönebilirsiniz. Seyahat etmek embriyo transferine olumsuz bir etkisi yoktur.", "sort_order": 26},
          {"question": "Aşılama yöntemi (gebelik aşısı) nedir?", "answer": "Aşılama yöntemi kadının yumurtalıklarının uyarılarak, yumurtlamanın tetiklenmesi bununla uygun zamanlı olarak erkek sperminin yıkama işleminden geçirilerek rahim içine bir kanül yardımı ile ulaştırılmasıdır. Aşılama ilkel bir yöntem olup başarı şansı tüp bebek tedavisine göre oldukça düşüktür. Maliyeti ve tedavinin yaratacağı stres tüp bebek tedavisinden daha az olacağı için seçilmiş vakalarda uygulanabilir.", "sort_order": 27},
          {"question": "Ovülasyon indüksiyonu nedir?", "answer": "Üreme çağındaki bir kadının yumurtalıklarında her ay ortalama 10-20 adet yumurta büyüme eğilimindedir. Bunların arasından bir tanesi (dominant folikül) diğerlerinin büyümesini engeller ve kendisi ovülasyon (yumurtlama) ile tüpün olduğu bölgeye atılır. Üremeye yardımcı tedavilerde (aşılama, tüp bebek vs...) mümkün olan en fazla yumurta toplanması için dışarıdan hormon veya hormon üretimini artıran ilaç tedavisi verilir. Bu sayede bir siklusta (aylık döngüde) büyümesi mümkün olan tüm foliküller (yumurta içeren sıvı kesecikleri) uyarılmış olur. Bu foliküller belli bir boyuta ulaştığı zaman (ortalama 18 mm)", "sort_order": 28},
          {"question": "ICSI (mikroenjeksiyon) IVF (tüp bebek)'in klasik IVF'ten farkı nedir?", "answer": "Klasik tüp bebek tedavisinde yumurta sağlıklı spermlerin olduğu bir kaba yerleştirilir. Spermlerden bir tanesi yumurta zarını delerek dölleme işlemini kendisi başlatır. ICSI'de ise sperm ince bir kanül yardımı ile alınarak yumurta içine yerleştirilir. Bu sayede spermin yumurta içine girmesi şansa bırakılmamış olur. ICSI yönteminde yumurta dölleme oranı daha yüksektir.", "sort_order": 29},
          {"question": "Tüp bebek tedavisinden önce aşılama yapılması gerekli midir?", "answer": "Aşılama tedavisinin başarıya ulaşması için uygun koşullar gerekir. Sperm sayısı normal olan bir erkek ve düzenli yumurtlaması olan bir kadının cinsel ilişkiye girme sıklığında da sorun yoksa aşılamadan fayda görme şansı oldukça azdır. Seçilmiş hasta grubunda fayda sağlasa da aşılama yöntemi her tüp bebek tedavisinden önce uygulanmaz.", "sort_order": 30},
          {"question": "Tüplerin kapalı olması mutlaka tüp bebek tedavisini gerektirir mi?", "answer": "Tüpler tıkalı ise bir hasara bağlı tıkalı olduğu düşünülür. Operasyon ile tüpler açılmaya çalışılsa bile tüpteki hasarlar tamir edilemez. Her iki tüpün tıkalı olması tüp bebek tedavisinin yapılmasını gerektirir.", "sort_order": 31},
          {"question": "Tek tüpün tıkalı olması gebelik şansını azaltır mı?", "answer": "Tek tüpün açık olması gebelik şansını önemli ölçüde azaltmaz.", "sort_order": 32},
          {"question": "Kadın faktör kısırlığının en sık sebepleri nelerdir?", "answer": "Kadına bağlı en sık kısırlık sebebi yumurtlamadaki problemlerdir (polikistik over sendromu gibi). Daha sonra azalmış yumurtalık rezervi, tüpleri tutan hastalıklar, vajinismus, endometriozis gibi nedenler sayılabilir.", "sort_order": 33},
          {"question": "Erkek faktör kısırlığının tedavisi her zaman tüp bebek tedavisi midir?", "answer": "Sperm sayılarındaki sorun hormon üretimindeki yetersizliğe bağlı ise baba adayı ilaç tedavilerinden fayda görebilir.", "sort_order": 34},
          {"question": "IMSI (intrasitoplazmik morfoloji bakımından seçilmiş sperm enjeksiyonu) nedir?", "answer": "İmsi yöntemi tüp bebek tedavisinde, bir sperm seçme yöntemidir. Özellikle ağır erkek faktörü (sperm sayımı oldukça düşük, hareketlilik az ve yapısal olarak kötü durumda ise) olan durumlarda yumurta içine yerleştirilecek olan spermin dikkatle seçilmesi gerekir. Normal bir sperm seçme yönteminde 400 kez büyütme altında sperm seçilirken IMSI yönteminde büyütme 6000-10000 arasında büyütme yapılır. Bu sayede spermin çekirdeği de değerlendirilebilir. Kıbrıs'ta tüp bebek tedavisinde kendi laboratuvarımızda bu yöntemi standart olarak uygulamaktayız.", "sort_order": 35},
          {"question": "Mikroenjeksiyon yöntemi (ICSI) nedir?", "answer": "Tüp bebek tedavisi sırasında spermin mikroskobik bir kanül yardımı ile yumurta içine enjekte edildiği bir yöntemdir. Kıbrıs'ta tüp bebek tedavisi sırasında kliniğimizde standart olarak bu yöntem kullanılmaktadır.", "sort_order": 36},
          {"question": "Azospermi nedir?", "answer": "Erkek boşalma sıvısında hiç sperme rastlanmamasıdır.", "sort_order": 37},
          {"question": "Azospermi her zaman sperm donasyonu tedavisi gerektirir mi?", "answer": "Azospermi durumunda sebep araştırılarak mikro-TESE işlemi ile testislerden doku örneği alınarak mikroskop altında sperm araması yapılır. Tedavi başarısı ve detaylar için sitemiz güncel kısmına bakabilirsiniz.", "sort_order": 38},
          {"question": "Sigara kısırlık yapar mı?", "answer": "Sigara kadın ve erkeklerde ayrı ayrı kısırlık nedenidir. Kadınlarda sadece yumurtaları değil rahim duvarını da olumsuz etkiler. Erkeklerde ise sperm hareketliliği ve sperm DNA'si üzerinde olumsuz etkiye sahiptir.", "sort_order": 39},
          {"question": "Tüplerin bağlanmasından sonra gebelik kararı alınırsa ne yapılmalıdır?", "answer": "Tüp ligasyonu yani tüplerin bağlanması işlemi sonrasında gebelik kararı alınırsa en doğru yaklaşım tüp bebek tedavisi olacaktır. Ameliyat ile tüplerin tekrardan tamiri; sağlıklı gebelik ihtimali düşük ve dış gebelik riski yüksek bir tedavi seçeneğidir.", "sort_order": 40},
          {"question": "Tüplerin içinde sıvı olması (hidrosalpinks) veya iltihap olması (piyosalpinks) durumunda gebelik için en uygun yaklaşım ne olmalıdır?", "answer": "Tüplerin içinde sıvı olması kendiliğinden gebelik olma şansını ve tüp bebek başarısını oldukça düşüren bir durumdur. Bu problem olduğu zaman laparoskopik (kapalı) operasyonla hasta olan tüpün çıkarılması gerekir.", "sort_order": 41},
          {"question": "Tüplerde sıvı birikmesi ve tüplerdeki tıkanıklığın en sık nedeni nedir?", "answer": "Klamidya ve Neiseria gibi enfeksiyonlar tüplerdeki yapışıklık, tıkanıklık ve sıvı birikmesine neden olan en sık etkenlerdir.", "sort_order": 42},
          {"question": "Tekrarlayan gebelik kayıplarında (düşüklerde) tüp bebek tedavisi faydalı olur mu?", "answer": "Tekrarlayan gebelik kayıplarının en sık bilinen sebebi genetik sorunlardır. Bunun dışında birçok düşüğün sebebi belli değildir. Tüp bebek tedavisi sırasında PGD veya NGS gibi genetik tanı testleri yapılarak embriyonun transfer edilmeden önce genetik hastalığı olup olmadığına bakılabilir.", "sort_order": 43},
          {"question": "Tüp bebek tedavisi en fazla kaç kez tekrarlanabilir?", "answer": "Tüp bebek tedavilerinin kesin bir üst sınırı yoktur fakat 7-8 denemeden fazlası pek önerilmez. Bunun nedeni gebelik şansının az olmasıdır. Her tedavi çifti maddi ve manevi yıkıma uğratmaktadır. Sorunun sperm veya yumurta kaynaklı olduğu biliniyor ise donasyon tedavisi önerilebilir. Kıbrıs'ta donasyon tedavileri yasal olarak uygulanmaktadır.", "sort_order": 44},
          {"question": "Kıbrıs'ta tüp bebek tedavileri neden farklıdir?", "answer": "Kıbrıs'ın kuzeyindeki tüp bebek yönetmeliği dünyanın birçok ülkesinin aksine yumurta, sperm ve embriyo bağışına izin vermektedir.", "sort_order": 45},
          {"question": "Donasyon nedir?", "answer": "Kendi üreme hücreleri ile gebelik elde etmesi mümkün olmayan çiftlerin bağış yoluyla başka bireylerden yumurta, sperm veya her ikisini de almalarıdır.", "sort_order": 46},
          {"question": "Sperm donasyonu (bağışı) nedir?", "answer": "Sperm bağışı tescilli uluslararası bir sperm bankasından tüp bebek işleminde kullanılmak üzere alınır. Kadın yumurtaları alınan spermler ile döllenir ve anne rahmine transfer edilir.", "sort_order": 47},
          {"question": "Sperm donasyonu için nereye başvuru yapılır?", "answer": "Sperm donasyonu için bu konuda yetkili bir tüp bebek merkezine başvurulur. Tüp bebek merkezi sizin için dünya üzerindeki herhangi bir sperm bankasından sperm talebi yapabilir.", "sort_order": 48},
          {"question": "Tüp bebek tedavisi hangi mevsimde yapılmalıdır?", "answer": "Tüp bebek başarı oranları mevsimlerden etkilenmez.", "sort_order": 49},
          {"question": "Kıbrıs'ta yapılan tüp bebek tedavileri dünyada farklı ülkelerde de yapılır mı?", "answer": "Yumurta bağışı gibi tedaviler dünyada belli başlı az sayıda ülkede yapılıyor olmasına rağmen fiyat, başarı, ulaşım, güvenlik ve bekleme süresini düşündüğümüzde en doğru tercih olarak Kıbrıs olarak karşımıza çıkmaktadır.", "sort_order": 50},
          {"question": "Yumurta donasyonunda donor ve alıcı anne-baba adayı birbirlerini tanıyabilir mi?", "answer": "Donasyon tedavisinin esası gizliliktir. Anne-baba adayları hiçbir şekilde donorun adını soyadını bilmemelidir veya fotoğrafını görmemelidir. Bu etik olarak uygun değildir ve ciddi yasal sorunlar yaşanmasına neden olur!", "sort_order": 51},

        document.getElementById('start-btn').addEventListener('click', async () => {
            const email = document.getElementById('email').value;
            const pwd = document.getElementById('password').value;
            if(!email || !pwd) return alert("E-posta ve şifre girin.");
            
            document.getElementById('start-btn').disabled = true;
            document.getElementById('log').innerHTML += "Giriş yapılıyor...<br>";

            try {
                await signInWithEmailAndPassword(auth, email, pwd);
                document.getElementById('log').innerHTML += "Giriş başarılı! Sorular yükleniyor (Lütfen bekleyin)...<br>";

                let count = 0;
                for(let f of faqs) {
                    await addDoc(collection(db, "faqs"), {
                        question: f.question,
                        answer: f.answer,
                        sortOrder: f.sort_order || count
                    });
                    count++;
                }

                document.getElementById('log').innerHTML += "<strong>BAŞARILI: Tam " + count + " adet soru Firebase SSS kısmına yüklendi! 🎉</strong><br>Artık bu sayfayı kapatıp admin panele dönebilirsiniz.";
            } catch(e) {
                document.getElementById('log').innerHTML += "<span style='color:red'>Hata: " + e.message + "</span><br>";
                document.getElementById('start-btn').disabled = false;
            }
        });
